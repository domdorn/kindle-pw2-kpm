name: Build KPM Packages

on:
  push:
    branches: [main]
  schedule:
    # Check for upstream updates weekly (Monday 06:00 UTC)
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build all packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_BASE_URL: "https://github.com/${{ github.repository }}/releases/download"
          REPO_ID: ${{ vars.REPO_ID || 'dominikdorn' }}
          REPO_NAME: ${{ vars.REPO_NAME || 'Dominik Dorn KPM Repo' }}
          REPO_DESC: ${{ vars.REPO_DESC || 'kindlepw2-compatible packages' }}
        run: python build.py

      - name: Publish packages as GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for kpkg in dist/*.kpkg; do
            fname=$(basename "$kpkg")
            id=$(echo "$fname" | cut -d_ -f1)
            version=$(echo "$fname" | cut -d_ -f2)
            tag="${id}-${version}"
            gh release view "$tag" > /dev/null 2>&1 || \
              gh release create "$tag" --title "$tag" --notes "Auto-built by CI"
            gh release upload "$tag" "$kpkg" --clobber
          done

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.v2.json
          git diff --cached --quiet || git commit -m "chore: update manifest.v2.json [skip ci]"
          git push
