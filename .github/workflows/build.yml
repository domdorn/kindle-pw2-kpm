name: Build KPM Packages

on:
  push:
    branches: [main]
  schedule:
    # Check for upstream updates weekly (Monday 06:00 UTC)
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build all packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_BASE_URL: ${{ vars.REPO_BASE_URL || 'https://dominikdorn.com/kpm' }}
          REPO_ID: ${{ vars.REPO_ID || 'dominikdorn' }}
          REPO_NAME: ${{ vars.REPO_NAME || 'Dominik Dorn KPM Repo' }}
          REPO_DESC: ${{ vars.REPO_DESC || 'kindlepw2-compatible packages' }}
        run: python build.py

      - name: Upload kpkgs to server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || 'admin.meinweb.at' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/vhosts/dominikdorn.com/httpdocs/kpm/' }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '47251' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          scp -P "$DEPLOY_PORT" -i ~/.ssh/deploy_key \
            dist/*.kpkg manifest.v2.json \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}"

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.v2.json
          git diff --cached --quiet || git commit -m "chore: update manifest.v2.json [skip ci]"
          git push
