name: Build KPM Packages

on:
  push:
    branches: [main]
  schedule:
    # Check for upstream updates weekly (Monday 06:00 UTC)
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build all packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_ID: ${{ vars.REPO_ID || 'dominikdorn' }}
          REPO_NAME: ${{ vars.REPO_NAME || 'Dominik Dorn KPM Repo' }}
          REPO_DESC: ${{ vars.REPO_DESC || 'kindlepw2-compatible packages' }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          REPO_BASE_URL="https://github.com/${{ github.repository }}/releases/download/build-${SHORT_SHA}" \
            python build.py

      - name: Publish packages as GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="build-${SHORT_SHA}"
          gh release create "$TAG" --title "$TAG" --notes "Auto-built by CI" dist/*.kpkg

      - name: Clean up old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | \
            grep '^build-' | tail -n +6 | \
            xargs -r -I{} gh release delete {} --yes --cleanup-tag

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.v2.json
          git diff --cached --quiet || git commit -m "chore: update manifest.v2.json [skip ci]"
          git push
